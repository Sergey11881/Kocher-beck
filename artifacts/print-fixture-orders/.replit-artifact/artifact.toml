kind = "mobile"
previewPath = "/print-fixture-orders/"
title = "Kocher+Beck Smart Order"
description = "Мобильное приложение Kocher+Beck Smart Order для пошагового оформления заявок на типографскую оснастку, сохранения черновиков и просмотра отправленных заказов."
version = "1.0.0"
id = "artifacts/print-fixture-orders"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/print-fixture-orders/" ]
localPort = 25034

[services.development]
run = "pnpm --filter @workspace/print-fixture-orders run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/print-fixture-orders", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/print-fixture-orders", "run", "serve" ]

[services.env]
PORT = "25034"
BASE_PATH = "/print-fixture-orders/"
